# Fertilizer and amendment products available for recommendations.
#
# Analyses: the grade on the bag defines the N-P2O5-K2O percentages, so these are facts.
# Prices: urea and potash are converted from DTN's national average RETAIL FARM prices for
# Oct 12-16, 2026 (urea $674/ton, potash $503/ton -> per 50-lb bag = $/ton x 50 / 2000).
# Garden-center bag prices are usually higher; replace with a local quote and its date.
# DTN does not track triple superphosphate, 10-10-10 or garden lime: those prices are
# still placeholders.

- id: fert-10-10-10
  name: "10-10-10 granular"
  type: synthetic
  role: null
  n_pct: 10
  p2o5_pct: 10
  k2o_pct: 10
  bag_lb: 50
  price_usd_per_bag: 20     # PLACEHOLDER: get a local quote
  verified: false

- id: urea-46-0-0
