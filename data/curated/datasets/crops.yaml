# Crop definitions for Soil-Smart Planner.
#
# family:    botanical family (Clemson HGIC 1330 crop rotation family list).
# n_demand:  feeder group from UGA C963 "Vegetable Gardening in Georgia"
#            (heavy, medium, light). Legumes are "fixer" in this engine.
#            Broccoli and garlic are not listed in C963; see comments on those rows.
# target_ph: Clemson HGIC "Fertilizing Vegetables": optimum 6.0-6.5 for most vegetables;
#            the top of the range (6.5) is used as the liming target. Exceptions noted per row.
# n_need_lb_per_1000sqft: Clemson HGIC "Fertilizing Vegetables" home-garden program,
#            about 1.0 lb N preplant (6.5 lb calcium nitrate) + 1.55 lb N sidedress
#            (10 lb calcium nitrate) = ~2.55 lb N per 1000 sq ft. Clemson gives one rate
#            for all vegetables, so heavy and medium feeders share it.
#            LEGUMES: 0 lb N is a planner assumption (they fix their own N), NOT a sourced
#            value. UGA C963 still lists beans as medium and southern peas as light feeders.
#            Decide as a team and record the decision here.

- id: tomato
  name: Tomato
  family: nightshade
  n_demand: heavy
  target_ph: 6.5
  n_need_lb_per_1000sqft: 2.55
  source: SRC-CLEMSON-FERTVEG
  verified: false

